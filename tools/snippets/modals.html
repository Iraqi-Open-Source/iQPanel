
    <div class="modal-backdrop" id="database-modal" role="dialog" aria-modal="true" aria-labelledby="database-modal-title" hidden>
      <div class="modal">
        <button class="modal-close icon-button" type="button" data-close-modal aria-label="Close dialog">×</button>
        <p class="eyebrow">INFRASTRUCTURE / DATABASE</p>
        <h2 id="database-modal-title">Create database</h2>
        <p class="modal-intro">Provision a MySQL database and user for a site.</p>
        <form id="database-form">
          <label>Site<select name="site_slug" id="database-site-select" required></select></label>
          <label>Database name<input name="db_name" required placeholder="my_app" /></label>
          <label>Database user <span class="optional">optional</span><input name="db_user" placeholder="Defaults to site user" /></label>
          <label>Password <span class="optional">optional</span><input name="password" type="password" autocomplete="new-password" placeholder="Generated if empty" /></label>
          <div class="form-row">
            <label>Engine<select name="engine"><option value="mysql">MySQL</option><option value="mariadb">MariaDB</option></select></label>
            <label>Mode<select name="mode"><option value="create">Create new</option><option value="attach">Attach existing</option></select></label>
          </div>
          <div class="modal-actions"><button type="button" class="secondary-button" data-close-modal>Cancel</button><button class="primary-button" type="submit">Create <span>→</span></button></div>
        </form>
      </div>
    </div>

    <div class="modal-backdrop" id="cron-modal" role="dialog" aria-modal="true" aria-labelledby="cron-modal-title" hidden>
      <div class="modal">
        <button class="modal-close icon-button" type="button" data-close-modal aria-label="Close dialog">×</button>
        <p class="eyebrow">INFRASTRUCTURE / CRON</p>
        <h2 id="cron-modal-title">Add cron job</h2>
        <p class="modal-intro">Five-field cron schedule synced to the server crontab.</p>
        <form id="cron-form">
          <label>Site <span class="optional">optional</span><select name="site_slug" id="cron-site-select"><option value="">Server-wide</option></select></label>
          <label>Schedule<input name="schedule" required placeholder="*/5 * * * *" /></label>
          <label>Command<input name="command" required placeholder="/usr/bin/php artisan schedule:run" /></label>
          <label>Run as user<input name="run_as_user" value="www-data" /></label>
          <label class="cron-enabled-row"><input type="checkbox" name="enabled" checked /> Enabled</label>
          <div class="modal-actions"><button type="button" class="secondary-button" data-close-modal>Cancel</button><button class="primary-button" type="submit">Save <span>→</span></button></div>
        </form>
      </div>
    </div>
